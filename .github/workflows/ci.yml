name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push replaces an older run that's still going: fewer jobs waiting for GitHub's
# limited macOS runners (queued macOS jobs have been cancelled for lack of capacity).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package (unpacked, unsigned)
        if: runner.os != 'Linux'
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Linux: build the real AppImage and .deb packages, so packaging problems show up before a release.
      - name: Package (Linux AppImage and .deb)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never && ls -la release
