name: Release

# Push a tag like v0.4.2 to build installers for macOS, Windows and Linux,
# publish them as a GitHub release, and test the one-line installers.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build installers
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Add stable file names, install scripts and checksums
        run: |
          set -eu
          cd installers
          # Stable names (no version), so README links and install scripts always get the latest.
          for f in *; do
            case "$f" in
              *-mac-arm64.dmg) cp "$f" WA-Premium-Plus-mac-arm64.dmg ;;
              *-mac-x64.dmg) cp "$f" WA-Premium-Plus-mac-x64.dmg ;;
              *-windows-setup.exe) cp "$f" WA-Premium-Plus-windows-setup.exe ;;
              *-linux-arm64.AppImage) cp "$f" WA-Premium-Plus-linux-arm64.AppImage ;;
              *-linux-x86_64.AppImage | *-linux-x64.AppImage) cp "$f" WA-Premium-Plus-linux-x64.AppImage ;;
              *-linux-arm64.deb) cp "$f" WA-Premium-Plus-linux-arm64.deb ;;
              *-linux-amd64.deb | *-linux-x64.deb) cp "$f" WA-Premium-Plus-linux-amd64.deb ;;
            esac
          done
          cp ../scripts/install.sh ../scripts/install.ps1 .
          cp ../resources/icon.png WA-Premium-Plus-icon.png
          sha256sum * > SHA256SUMS
          ls -la
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" installers/* \
            --repo "${{ github.repository }}" \
            --title "WA Premium Plus ${{ github.ref_name }}" \
            --notes-file .github/release-notes.md

  test-install:
    name: Test install (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install with the one-line command (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          WAPP_VERSION: ${{ github.ref_name }}
          WAPP_NO_LAUNCH: '1'
        run: curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh" | sh
      - name: Check the installed app (macOS)
        if: runner.os == 'macOS'
        run: test -x "/Applications/WA Premium Plus.app/Contents/MacOS/WA Premium Plus" && codesign --verify --deep "/Applications/WA Premium Plus.app"
      - name: Check the installed app (Linux)
        if: runner.os == 'Linux'
        run: test -x "$(command -v wa-premium-plus)" && dpkg -s wa-premium-plus | grep -E '^(Status|Version)'
      - name: Install with the AppImage fallback (Linux)
        if: runner.os == 'Linux'
        env:
          WAPP_VERSION: ${{ github.ref_name }}
          WAPP_NO_LAUNCH: '1'
          WAPP_FORMAT: appimage
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh" | sh
          test -x "$HOME/.local/share/wa-premium-plus/WA-Premium-Plus.AppImage"
          test -f "$HOME/.local/share/applications/wa-premium-plus.desktop"
      - name: Install with the one-line command (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WAPP_VERSION: ${{ github.ref_name }}
          WAPP_NO_LAUNCH: '1'
        run: |
          irm "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.ps1" | iex
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\WA Premium Plus\WA Premium Plus.exe")) { throw 'not installed' }
