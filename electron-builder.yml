appId: com.wapremiumplus.app
productName: WA Premium Plus
copyright: Copyright © 2026 WA Premium Plus contributors

directories:
  buildResources: build
  output: release

files:
  - '!**/.vscode/*'
  - '!{src,scripts,tests,docs,assets,resources,release,.github}/**'
  - '!{electron.vite.config.ts,electron-builder.yml,tsconfig.node.json,tsconfig.web.json}'
  - '!{README.md,CONTRIBUTING.md,.gitignore,.env,.env.*}'

# Tray and window icons, loaded from process.resourcesPath at runtime.
extraResources:
  - from: resources
    to: resources

mac:
  icon: build/icon-mac.png
  category: public.app-category.social-networking
  # Ad-hoc signature: lets the app run on Apple Silicon without a paid Apple Developer
  # account. macOS still asks the user to confirm the first launch (see README).
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: WA Premium Plus uses the microphone to record voice messages and for calls in WhatsApp Web.
    NSCameraUsageDescription: WA Premium Plus uses the camera for video calls in WhatsApp Web.
  target:
    - target: dmg
      arch: [arm64, x64]

dmg:
  artifactName: WA-Premium-Plus-${version}-mac-${arch}.${ext}

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: WA-Premium-Plus-${version}-windows-setup.${ext}

linux:
  icon: build/icon.png
  category: Network
  executableName: wa-premium-plus
  synopsis: WhatsApp desktop app with message scheduling
  maintainer: WA Premium Plus <84061957+imbikramsaha@users.noreply.github.com>
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]

appImage:
  artifactName: WA-Premium-Plus-${version}-linux-${arch}.${ext}

deb:
  artifactName: WA-Premium-Plus-${version}-linux-${arch}.${ext}

publish: null
